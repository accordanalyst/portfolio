<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Foxglove — Remediate Action</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f060c; --surface:#190b14; --surface2:#241420; --line:#3a1f2e;
    --ink:#fbeef4; --muted:#b07f96; --accent:#ff5ea8; --good:#4fe6a0; --warn:#f4c15a; --bad:#ff486b;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Space Grotesk',sans-serif; padding:2.5rem 1.5rem; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  .wrap { max-width: 560px; margin: 0 auto; }

  .panel { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:1.5rem; }
  .panel h2 { margin:0 0 0.3rem; font-size:1.1rem; }
  .panel .sub { color:var(--muted); font-size:0.85rem; margin:0 0 1.3rem; }

  .layer-row {
    display:flex; align-items:center; gap:0.8rem; padding:0.6rem 0; border-bottom:1px solid var(--line);
    transition: background 0.3s;
  }
  .layer-row:last-child { border-bottom:none; }
  .layer-idx { font-family:'IBM Plex Mono',monospace; font-size:0.65rem; color:var(--muted); width: 24px; }
  .layer-name { flex:1; font-size:0.88rem; }
  .layer-detail { font-family:'IBM Plex Mono',monospace; font-size:0.65rem; color:var(--muted); display:block; }
  .health-bar { width:90px; height:6px; background:var(--surface2); border-radius:99px; overflow:hidden; }
  .health-fill { height:100%; border-radius:99px; transition: width 0.6s ease, background 0.6s ease; }
  .health-pct { font-family:'IBM Plex Mono',monospace; font-size:0.7rem; width:34px; text-align:right; }
  .status-icon { width:16px; text-align:center; font-size:0.9rem; transition: transform 0.3s; }

  .remediate-btn {
    width:100%; margin-top:1.4rem; padding:0.85rem; border:none; border-radius:6px;
    background: linear-gradient(135deg, var(--accent), #c63d82); color:#1a0410; font-weight:700;
    font-size:0.95rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.6rem;
    transition: opacity 0.2s, transform 0.1s;
  }
  .remediate-btn:active { transform: scale(0.98); }
  .remediate-btn:disabled { opacity:0.55; cursor:not-allowed; }
  .remediate-btn.done { background: linear-gradient(135deg, var(--good), #2f9e6e); color:#062014; }

  .console {
    margin-top:1rem; background:#0a0408; border:1px solid var(--line); border-radius:6px;
    padding:0.85rem; font-family:'IBM Plex Mono',monospace; font-size:0.72rem; color:var(--muted);
    height:110px; overflow-y:auto;
  }
  .console .line { opacity:0; animation: appear 0.25s forwards; margin-bottom:0.25rem; }
  .console .line.ok { color: var(--good); }
  .console .line.warn { color: var(--warn); }
  @keyframes appear { to { opacity:1; } }

  .spinner {
    width:14px; height:14px; border:2px solid rgba(255,255,255,0.25); border-top-color: #1a0410;
    border-radius:50%; animation: spin 0.7s linear infinite; display:none;
  }
  .remediate-btn.loading .spinner { display:inline-block; }
  .remediate-btn.loading .btn-label { display:none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .leaf-burst { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; z-index: 50; }
  .leaf-burst span {
    position:absolute; font-size:1.1rem; opacity:0; top: 50%; left: 50%;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h2>🌿 Defenses — Layer Health</h2>
    <p class="sub">One layer has degraded. Remediation re-syncs blocklists, re-verifies script integrity, and re-arms honeypots.</p>

    <div id="layers"></div>

    <button class="remediate-btn" id="remediate-btn">
      <span class="spinner"></span>
      <span class="btn-label">⚡ Remediate compromised layer</span>
    </button>

    <div class="console mono" id="console">
      <div class="line">&gt; system idle. awaiting command.</div>
    </div>
  </div>
</div>

<div class="leaf-burst" id="leaf-burst"></div>

<script>
const layerData = [
  { idx:'L0', name:'DNS / CDN edge', detail:'Bot Fight · WAF · Labyrinth', health: 99, status:'good' },
  { idx:'L1', name:'Server', detail:'fail2ban · ModSecurity', health: 97, status:'good' },
  { idx:'L2', name:'Application', detail:'UA · rate limit · JA3/JA4 — INTEGRITY CHECK FAILED', health: 41, status:'bad' },
  { idx:'L3', name:'Content', detail:'poison-text · canvas', health: 100, status:'good' },
  { idx:'L4', name:'Monitoring', detail:'log analysis · honeypot', health: 96, status:'good' },
];

const colorFor = (h) => h >= 90 ? 'var(--good)' : h >= 60 ? 'var(--warn)' : 'var(--bad)';
const iconFor = (s) => s === 'good' ? '✅' : s === 'warn' ? '⚠️' : '🛑';

const layersEl = document.getElementById('layers');
function renderLayers() {
  layersEl.innerHTML = layerData.map(l => `
    <div class="layer-row" data-idx="${l.idx}">
      <span class="layer-idx">${l.idx}</span>
      <div class="layer-name">${l.name}<span class="layer-detail">${l.detail}</span></div>
      <div class="health-bar"><div class="health-fill" style="width:${l.health}%; background:${colorFor(l.health)};"></div></div>
      <span class="health-pct mono" style="color:${colorFor(l.health)};">${l.health}%</span>
      <span class="status-icon">${iconFor(l.status)}</span>
    </div>
  `).join('');
}
renderLayers();

const btn = document.getElementById('remediate-btn');
const consoleEl = document.getElementById('console');
const burst = document.getElementById('leaf-burst');

function log(text, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  consoleEl.appendChild(div);
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

const steps = [
  { t: '> isolating compromised layer L2...', d: 500 },
  { t: '> verifying script checksums against last known-good...', d: 700 },
  { t: '> MISMATCH found: ai-blocker.php', cls: 'warn', d: 600 },
  { t: '> restoring from signed backup...', d: 700 },
  { t: '> re-syncing blocklist.json (847 signatures)...', d: 700 },
  { t: '> re-arming honeypot endpoints...', d: 600 },
  { t: '> rotating active session tokens...', d: 600 },
  { t: '> L2 integrity check: PASSED', cls: 'ok', d: 500 },
  { t: '> all layers nominal. resuming protection.', cls: 'ok', d: 400 },
];

function leafBurst() {
  const leaves = ['🌿','🌸','✨'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.textContent = leaves[Math.floor(Math.random()*leaves.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 80 + Math.random() * 160;
    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
    s.style.transition = `transform 1.1s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease`;
    burst.appendChild(s);
    requestAnimationFrame(() => {
      s.style.opacity = '1';
      s.style.transform = `translate(${dx}px, ${dy}px) rotate(${Math.random()*360}deg)`;
    });
    setTimeout(() => { s.style.opacity = '0'; }, 700);
    setTimeout(() => s.remove(), 1300);
  }
}

btn.addEventListener('click', () => {
  if (btn.disabled) return;
  btn.disabled = true;
  btn.classList.add('loading');
  consoleEl.innerHTML = '';

  let elapsed = 0;
  steps.forEach(step => {
    elapsed += step.d;
    setTimeout(() => log(step.t, step.cls), elapsed);
  });

  setTimeout(() => {
    // animate L2 health climbing back up
    const l2 = layerData.find(l => l.idx === 'L2');
    const row = document.querySelector('.layer-row[data-idx="L2"]');
    let current = l2.health;
    const target = 98;
    const tick = setInterval(() => {
      current = Math.min(target, current + 6);
      l2.health = current;
      l2.status = current >= 90 ? 'good' : 'warn';
      row.querySelector('.health-fill').style.width = current + '%';
      row.querySelector('.health-fill').style.background = colorFor(current);
      row.querySelector('.health-pct').textContent = current + '%';
      row.querySelector('.health-pct').style.color = colorFor(current);
      row.querySelector('.status-icon').textContent = iconFor(l2.status);
      if (current >= target) {
        clearInterval(tick);
        row.querySelector('.layer-detail').textContent = 'UA · rate limit · JA3/JA4';
        btn.classList.remove('loading');
        btn.classList.add('done');
        btn.querySelector('.btn-label').textContent = '✅ All layers restored';
        btn.querySelector('.btn-label').style.display = 'inline';
        leafBurst();
      }
    }, 90);
  }, elapsed + 200);
});
</script>
</body>
</html>
