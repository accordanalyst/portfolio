<svg viewBox="0 0 629.640625 531" xmlns="http://www.w3.org/2000/svg">
<defs><style>
  :root {
    --bg: #0B0710;
    --panel: #160F1F;
    --panel2: #1E1429;
    --line: #322342;
    --pink: #FF2D87;
    --pink-soft: #3D1029;
    --gold: #FFC857;
    --violet: #9D4EDD;
    --text: #F1E9F7;
    --dim: #9C8AAE;
    --sans: 'Inter', sans-serif;
    --display: 'Anton', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    background-image: radial-gradient(circle at 20% 0%, rgba(255,45,135,0.10), transparent 45%),
                       radial-gradient(circle at 85% 10%, rgba(157,78,221,0.10), transparent 40%);
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 70px; }

  header.top { padding: 44px 0 26px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin: 0 0 12px; }
  h1.title {
    font-family: var(--display); font-weight: 400; font-size: 44px; letter-spacing: .01em; margin: 0 0 10px;
    background: linear-gradient(95deg, var(--pink), var(--violet) 60%, var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent; text-transform: uppercase;
  }
  .sub { font-size: 14.5px; color: var(--dim); max-width: 640px; margin: 0 0 6px; }
  .disclaimer { font-size: 11.5px; color: var(--dim); opacity: .75; max-width: 640px; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 28px 0 8px; }
  @media (max-width: 800px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .kpi-label { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 8px; }
  .kpi-value { font-family: var(--mono); font-size: 24px; font-weight: 600; margin: 0; color: var(--text); }
  .kpi-value.accent { color: var(--gold); }

  .season-row { display: flex; flex-wrap: wrap; gap: 7px; margin: 26px 0 0; }
  .pill {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em;
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    padding: 7px 13px; border-radius: 14px; cursor: pointer; transition: all .15s ease;
  }
  .pill:hover { border-color: var(--pink); color: var(--text); }
  .pill.active { background: linear-gradient(135deg, var(--pink), var(--violet)); color: #fff; border-color: transparent; }

  .panel-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; margin-top: 28px; }
  @media (max-width: 880px) { .panel-grid { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; }
  .panel-title { font-family: var(--display); font-size: 16px; letter-spacing: .02em; text-transform: uppercase; color: var(--text); margin: 0 0 4px; }
  .panel-note { font-size: 12px; color: var(--dim); margin: 0 0 14px; }

  .full-row { margin-top: 18px; }

  .tooltip {
    position: absolute; pointer-events: none; background: #2A1B38; border: 1px solid var(--pink);
    border-radius: 6px; padding: 8px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--text);
    box-shadow: 0 6px 18px rgba(0,0,0,.4); opacity: 0; transition: opacity .1s ease; z-index: 10;
  }

  table.roster { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.roster th {
    text-align: left; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--dim); padding: 0 8px 8px 0; border-bottom: 1px solid var(--line);
  }
  table.roster td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); color: var(--text); }
  table.roster tr:last-child td { border-bottom: none; }
  table.roster .rank-1 { color: var(--gold); font-weight: 700; }
  table.roster .crown { margin-right: 4px; }

  .legend-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--dim); }
  .legend-dot { width: 9px; height: 9px; border-radius: 2px; }

  footer.foot {
    border-top: 1px solid var(--line); margin-top: 34px; padding-top: 18px;
    font-family: var(--mono); font-size: 10.5px; color: var(--dim); line-height: 1.7;
  }
  footer.foot a { color: var(--gold); text-decoration: none; }

  .axis path, .axis line { stroke: var(--line); }
  .axis text { fill: var(--dim); font-family: var(--mono); font-size: 10px; }
  .gridline { stroke: var(--line); stroke-dasharray: 2,3; opacity: .5; }
</style></defs>
<rect width="629.640625" height="531" rx="10" fill="#160F1F"/>
<text x="24" y="34" font-family="'Anton', sans-serif" font-size="16" font-weight="700" letter-spacing="0.3" fill="#F1E9F7" style="text-transform:uppercase">Queens &amp; Average Age by Season</text>
<text x="24" y="56" font-family="Inter, sans-serif" font-size="11.5" fill="#9C8AAE">Bars = number of queens that season. Line = average age. Click a season pill above to</text>
<text x="24" y="71" font-family="Inter, sans-serif" font-size="11.5" fill="#9C8AAE">highlight it.</text>
<circle cx="28" cy="98" r="4" fill="rgb(255, 45, 135)"/>
<text x="38" y="102" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9C8AAE">Queens (count)</text>
<circle cx="144.8" cy="98" r="4" fill="rgb(255, 200, 87)"/>
<text x="154.8" y="102" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#9C8AAE">Avg. age</text>
