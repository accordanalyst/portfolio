-anchor="end"><path class="domain" stroke="currentColor" d="M0.5,0.5V224.5"></path><g class="tick" opacity="1" transform="translate(0,17.542168674698793)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">RuPaul</text></g><g class="tick" opacity="1" transform="translate(0,44.5301204819277)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Britney Spears</text></g><g class="tick" opacity="1" transform="translate(0,71.51807228915662)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Madonna</text></g><g class="tick" opacity="1" transform="translate(0,98.50602409638554)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Whitney Houston</text></g><g class="tick" opacity="1" transform="translate(0,125.49397590361446)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Aretha Franklin</text></g><g class="tick" opacity="1" transform="translate(0,152.4819277108434)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Lady Gaga</text></g><g class="tick" opacity="1" transform="translate(0,179.4698795180723)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Donna Summer</text></g><g class="tick" opacity="1" transform="translate(0,206.4578313253012)"><line stroke="currentColor" x2="0"></line><text fill="currentColor" x="-3" dy="0.32em">Cher</text></g></g></g></g>
</svg>