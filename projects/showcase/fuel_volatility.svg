<svg viewBox="0 0 666 359.171875" xmlns="http://www.w3.org/2000/svg">
<defs><style>
  :root {
    --bg: #0E1620;
    --panel: #16202C;
    --panel2: #1C2836;
    --line: #2A3A4D;
    --copper: #C98A4A;
    --copper-soft: #3A2C1C;
    --teal: #4FB8C4;
    --teal-soft: #1A3035;
    --amber: #E2B33D;
    --text: #E8EDF2;
    --dim: #8A99AA;
    --sans: 'Inter', sans-serif;
    --display: 'Sora', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.55; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 26px 80px; }

  header.top { padding: 46px 0 22px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--copper); margin: 0 0 14px; }
  h1.title { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: -.01em; margin: 0 0 10px; color: var(--text); }
  .sub { font-size: 14.5px; color: var(--dim); max-width: 660px; margin: 0 0 14px; }
  .source-line { font-size: 11.5px; color: var(--dim); opacity: .8; max-width: 700px; line-height: 1.7; }
  .source-line b { color: var(--teal); }

  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin: 26px 0 6px; }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: 1fr 1fr; } }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .kpi-label { font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 0 0 7px; }
  .kpi-value { font-family: var(--mono); font-size: 20px; font-weight: 600; margin: 0; }
  .kpi-value.copper { color: var(--copper); }
  .kpi-value.teal { color: var(--teal); }
  .kpi-sub { font-family: var(--mono); font-size: 10px; color: var(--dim); margin: 4px 0 0; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 22px 24px; margin-top: 22px; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
  .panel-title { font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--text); margin: 0 0 4px; }
  .panel-note { font-size: 12.5px; color: var(--dim); margin: 0 0 16px; max-width: 640px; }
  .legend-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--dim); }
  .legend-swatch { width: 16px; height: 3px; border-radius: 2px; }

  .brush-hint { font-family: var(--mono); font-size: 10.5px; color: var(--dim); opacity: .75; margin-top: 8px; }
  .reset-btn {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
    padding: 5px 11px; border-radius: 5px; cursor: pointer;
  }
  .reset-btn:hover { color: var(--teal); border-color: var(--teal); }

  .two-col { display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px; margin-top: 22px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .two-col .panel { margin-top: 0; }

  .region-row {
    display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .region-row:last-child { border-bottom: none; }
  .region-row:hover { background: var(--panel2); }
  .region-row.selected { background: var(--copper-soft); }
  .region-name { font-size: 12.5px; width: 150px; flex-shrink: 0; }
  .region-track { flex: 1; height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
  .region-fill { height: 100%; border-radius: 4px; background: var(--copper); }
  .region-price { font-family: var(--mono); font-size: 12.5px; width: 60px; text-align: right; }
  .region-date { font-family: var(--mono); font-size: 9.5px; color: var(--dim); width: 78px; text-align: right; }

  .detail-callout {
    background: var(--teal-soft); border: 1px solid var(--teal); border-radius: 8px; padding: 14px 16px; margin-top: 14px;
    font-size: 12.5px; color: var(--text); display: none;
  }
  .detail-callout.show { display: block; }
  .detail-callout .dc-title { font-family: var(--mono); font-size: 11px; color: var(--teal); text-transform: uppercase; margin: 0 0 6px; }

  .annotation-label {
    font-family: var(--mono); font-size: 10.5px; fill: var(--amber);
  }
  .axis path, .axis line { stroke: var(--line); }
  .axis text { fill: var(--dim); font-family: var(--mono); font-size: 10px; }
  .gridline { stroke: var(--line); stroke-dasharray: 2,3; opacity: .5; }

  .tooltip {
    position: absolute; pointer-events: none; background: #20303F; border: 1px solid var(--copper);
    border-radius: 6px; padding: 8px 11px; font-family: var(--mono); font-size: 11.5px; color: var(--text);
    box-shadow: 0 6px 18px rgba(0,0,0,.45); opacity: 0; transition: opacity .1s ease; z-index: 10;
  }

  footer.foot {
    border-top: 1px solid var(--line); margin-top: 30px; padding-top: 18px;
    font-family: var(--mono); font-size: 10.5px; color: var(--dim); line-height: 1.8;
  }
</style></defs>
<rect width="666" height="359.171875" rx="10" fill="#16202C"/>
<text x="24" y="34" font-family="'Sora', sans-serif" font-size="16" font-weight="700" letter-spacing="0.3" fill="#E8EDF2" style="text-transform:uppercase">Volatility — Week-over-Week % Change</text>
<text x="24" y="56" font-family="Inter, sans-serif" font-size="11.5" fill="#8A99AA">National average diesel price, week-over-week percent change. The Hormuz disruption window is the</text>
<text x="24" y="71" font-family="Inter, sans-serif" font-size="11.5" fill="#8A99AA">only period in this dataset where weekly moves exceeded ±5%.</text>
