<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeInSlow {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes blink {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
      .frame {
        opacity: 0;
        animation: fadeInSlow 1.4s ease-out forwards;
      }
      .title {
        font-family: 'Courier New', Courier, monospace;
        font-weight: 700;
        font-size: 56px;
        fill: #B33A4C;
        opacity: 0;
        animation: fadeIn 1.6s ease-out 0.6s forwards;
      }
      .subtitle {
        font-family: 'Courier New', Courier, monospace;
        font-size: 20px;
        letter-spacing: 1px;
        fill: #F2E9E2;
        opacity: 0;
        animation: fadeIn 1.6s ease-out 1.6s forwards;
      }
      .rule-track {
        opacity: 0;
        animation: fadeInSlow 0.6s ease-out 2.3s forwards;
      }
      .cursor {
        fill: #B33A4C;
        animation: blink 1.1s step-start 2.8s infinite;
      }
    </style>

    <linearGradient id="outerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17110F"/>
      <stop offset="100%" stop-color="#0A0706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#outerBg)"/>
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#2B211C" stroke-width="2"/>

  <g class="frame">
    <rect x="28" y="24" width="1144" height="232" fill="#0A0706" stroke="#3A2C25" stroke-width="1.5"/>
  </g>

  <text x="600" y="140" text-anchor="middle" class="title">ACCORDANALYST<tspan fill="#7A6A62">.exe</tspan></text>
  <rect x="1006" y="106" width="14" height="42" class="cursor"/>

  <text x="600" y="182" text-anchor="middle" class="subtitle">[ BUSINESS_INTELLIGENCE_ANALYST | DATA_ANALYST | PROCESS_AUTOMATION ]</text>

  <g class="rule-track">
    <rect x="360" y="200" width="480" height="6" rx="3" fill="#2B211C"/>
  </g>
  <rect x="360" y="200" width="120" height="6" rx="3" fill="#B33A4C" opacity="0">
    <set attributeName="opacity" to="1" begin="2.3s"/>
    <animate attributeName="width" from="120" to="480" begin="2.5s" dur="1.3s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <g font-family="'Courier New', Courier, monospace" font-size="12" text-anchor="middle">
    <text x="600" y="226" fill="#7a6a62" opacity="0">LOADING… 25%
      <set attributeName="opacity" to="1" begin="2.3s"/>
      <set attributeName="opacity" to="0" begin="2.66s"/>
    </text>
    <text x="600" y="226" fill="#7a6a62" opacity="0">LOADING… 40%
      <set attributeName="opacity" to="1" begin="2.66s"/>
      <set attributeName="opacity" to="0" begin="3.02s"/>
    </text>
    <text x="600" y="226" fill="#7a6a62" opacity="0">LOADING… 55%
      <set attributeName="opacity" to="1" begin="3.02s"/>
      <set attributeName="opacity" to="0" begin="3.38s"/>
    </text>
    <text x="600" y="226" fill="#7a6a62" opacity="0">LOADING… 70%
      <set attributeName="opacity" to="1" begin="3.38s"/>
      <set attributeName="opacity" to="0" begin="3.6s"/>
    </text>
    <text x="600" y="226" fill="#7a6a62" opacity="0">LOADING… 85%
      <set attributeName="opacity" to="1" begin="3.6s"/>
      <set attributeName="opacity" to="0" begin="3.8s"/>
    </text>
    <text x="600" y="226" fill="#B33A4C" font-weight="700" opacity="0">SYSTEM READY · 100%
      <set attributeName="opacity" to="1" begin="3.8s"/>
    </text>
  </g>
</svg>
